services: #header that wraps the whole content
  api: #service name
    build: #build the image
      context: . #current dir
    container_name: ecommerce-api
    ports: #yall already know
      - "8000:8000"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ecommerce
      DATABASE_USER: ecommerce
      DATABASE_PASSWORD: 12345
    volumes:
      - ./migrations:/app/migrations

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: ecommerce-postgres
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: 12345
    volumes:
      - ecommerce-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ecommerce-db-data:
