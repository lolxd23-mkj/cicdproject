apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cicdproject
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/lolxd23-mkj/cicdproject:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cicdproject-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cicdproject-secret
                  key: DATABASE_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cicdproject
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
